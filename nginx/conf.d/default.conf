# Cloudflare CDN/WAF sits in front — trust CF connecting IP when present
map $http_cf_connecting_ip $real_client_ip {
  default $remote_addr;
  ~.+     $http_cf_connecting_ip;
}

server {
  listen 80;
  server_name _;

  # Security headers (complement Helmet on API)
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Request-Id $proxy_request_id always;

  location = /nginx-health {
    access_log off;
    return 200 "ok\n";
  }

  location /api/ {
    limit_req zone=api_limit burst=60 nodelay;
    proxy_pass http://api_backend/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $real_client_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $proxy_request_id;
    proxy_set_header X-Correlation-Id $proxy_request_id;
    proxy_set_header Connection "";
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  location /api/v1/auth/ {
    limit_req zone=auth_limit burst=10 nodelay;
    proxy_pass http://api_backend/v1/auth/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $real_client_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $proxy_request_id;
    proxy_set_header X-Correlation-Id $proxy_request_id;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
  }

  location /_next/static/ {
    proxy_pass http://web_backend;
    proxy_cache_valid 200 7d;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /videos/ {
    proxy_pass http://web_backend;
    add_header Cache-Control "public, max-age=86400";
    add_header Accept-Ranges bytes;
  }

  location / {
    proxy_pass http://web_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $real_client_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $proxy_request_id;
    proxy_set_header X-Correlation-Id $proxy_request_id;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_cache_bypass $http_upgrade;
  }
}
