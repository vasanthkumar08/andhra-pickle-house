user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_x_request_id $proxy_request_id {
    default $http_x_request_id;
    ""      $request_id;
  }

  log_format main escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","request_id":"$proxy_request_id",'
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    '"bytes_sent":$body_bytes_sent,"request_time":$request_time,'
    '"upstream_addr":"$upstream_addr","upstream_status":"$upstream_status",'
    '"upstream_connect_time":"$upstream_connect_time","upstream_response_time":"$upstream_response_time",'
    '"http_referrer":"$http_referer","http_user_agent":"$http_user_agent","x_forwarded_for":"$http_x_forwarded_for"}';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  keepalive_requests 1000;
  types_hash_max_size 2048;
  client_max_body_size 55M;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

  upstream api_backend {
    zone api_backend 64k;
    least_conn;
    server api:4000 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }

  upstream web_backend {
    zone web_backend 64k;
    least_conn;
    server web:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }

  include /etc/nginx/conf.d/*.conf;
}
