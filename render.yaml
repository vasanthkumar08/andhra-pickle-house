services:
  - type: web
    name: andhra-pickle-house-api
    env: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run db:deploy -w @aph/api && npm run build:api
    startCommand: npm run start -w @aph/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: AUTH_PROVIDER
        value: legacy
      - key: OTP_PROVIDER
        value: twilio
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: WEB_URL
        sync: false
      - key: API_URL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      - key: TWILIO_FROM_PHONE
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: WHATSAPP_BUSINESS_NUMBER
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: OTP_EXPIRY_MINUTES
        value: 5
      - key: OTP_MAX_ATTEMPTS
        value: 5
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_UPLOAD_FOLDER
        value: andhra-pickle-house
      - key: CLOUDINARY_REQUIRED
        value: true
      - key: WORKER_CONCURRENCY
        value: 5
