services:
  - type: web
    name: andhra-pickle-house-api
    env: node
    plan: starter
    buildCommand: npm install && npm run build:api
    startCommand: npm run start -w @aph/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: WEB_URL
        sync: false
      - key: API_URL
        sync: false
